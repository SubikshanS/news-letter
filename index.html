<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
        <main class="signup-container">
        <div class="icon-container">
            <i class="far fa-envelope-open" aria-hidden="true"></i>
        </div>
            <h1>Join our newsletter</h1>
        <p>Get the latest updates and coding tips in your inbox.</p>
        <form action="#" method="post">
            <div class="input-group">
                    <i class="far fa-envelope" aria-hidden="true"></i>
                    <label class="sr-only" for="email">Email address</label>
                    <input id="email" name="email" type="email" required placeholder="Enter your email" autocomplete="email">
            </div>
                <button type="submit">Subscribe <i class="fas fa-arrow-right" aria-hidden="true"></i></button>
        </form>
        <div class="benefits">
                <ul>
                    <li class="benefit-item"><i class="fas fa-check" aria-hidden="true"></i>Weekly coding tips</li>
                    <li class="benefit-item"><i class="fas fa-check" aria-hidden="true"></i>Unsubscribe anytime</li>
                </ul>
        </div>
        </main>
</body>
</html>
