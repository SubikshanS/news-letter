<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsLetter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="signup-container">
        <div class="icon-container">
            <i class="far fa-envelope-open"></i>
        </div>
        <h2>Join Our NewsLetter</h2>
        <p>Get the latest updates and coding tips in your input</p>
        <form>
            <div class="input-group">
                <i class="far fa-envelope"></i>
                <input type="email" required placeholder="Enter Your Email">
            </div>
            <button>Subscribe <i class="fas fa-arrow-right"></i></button>
        </form>
        <div class="benefits">
            <p class="benefit-item"><i class="fas fa-check"></i>Weekly coding tips</p>
            <p class="benefit-item"><i class="fas fa-check"></i>UnSubscribe Anytime</p>
        </div>
    </div>    
</body>
</html>
